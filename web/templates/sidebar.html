{{define "sidebar"}}
<div class="tree-section">
  <div class="tree-section-header">Directories</div>
  <div class="tree-search" x-data="altoTreeSearch()">
    <input id="tree-search-input" type="text" placeholder="Search directories…" autocomplete="off" spellcheck="false"
           x-on:input.debounce.250ms="onInput($event.target.value)">
    <span class="tree-search-icon" aria-hidden="true"></span>
  </div>
  <div id="tree-root">
    {{if .TopDirsHTML}}{{.TopDirsHTML}}{{else}}
    <div style="padding:12px 16px;color:var(--muted);font-size:13px;">
      No directories indexed.<br>
      Click <strong>↻ Re-index</strong> to scan your library.
    </div>
    {{end}}
  </div>
</div>
{{end}}
