<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALTO — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --corpus-0:#15110c;--corpus-1:#1c1813;--corpus-2:#241f18;--corpus-3:#2d271f;
    --hair:rgba(255,247,233,0.06);--hair-strong:rgba(255,247,233,0.10);
    --wood-a:#432f1c;--wood-b:#21160c;
    --ink:#ece5d8;--ink-dim:#a89c89;--ink-mute:#776d5d;
    --teal:#3AD4C4;--green:#6EDD81;--cyan:#1EC2EC;--danger:#d2725f;
    --glow:0 0 0 1px rgba(58,212,196,.35),0 0 18px -2px rgba(58,212,196,.45);
    --grad:linear-gradient(90deg,var(--green),var(--teal),var(--cyan));
    --fd:"Space Grotesk",system-ui,sans-serif;--fb:"Manrope",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--fb);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 80% at 72% -10%,rgba(58,212,196,.05),transparent 60%),radial-gradient(90% 70% at 8% 112%,rgba(110,221,129,.04),transparent 55%),var(--corpus-0);}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  .shell{height:100vh;display:grid;grid-template-rows:58px 2px 1fr auto;}
  .seam{height:2px;background:linear-gradient(90deg,var(--wood-b),var(--wood-a) 16%,var(--wood-b) 42%,#19140d 100%);}

  .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;position:relative;
    background:linear-gradient(180deg,#231e16,#15110a);border-bottom:1px solid var(--hair-strong);box-shadow:0 1px 0 rgba(255,247,233,.04) inset,0 6px 18px -10px #000;}
  .brand{display:flex;align-items:center;gap:13px;}
  .mark{height:34px;display:grid;place-items:center;flex:0 0 auto;}
  .mark img{height:34px;width:auto;display:block;filter:drop-shadow(0 0 9px rgba(58,212,196,.4));}
  .wordmark{display:flex;flex-direction:column;line-height:1;}
  .wordmark b{font-family:var(--fd);font-weight:600;letter-spacing:.26em;font-size:15px;}
  .wordmark small{font-size:9.5px;letter-spacing:.18em;color:var(--ink-mute);text-transform:uppercase;margin-top:4px;}
  .ver{align-self:center;font-family:var(--fm);font-size:10px;color:var(--ink-mute);border:1px solid var(--hair-strong);border-radius:5px;padding:3px 7px;background:rgba(0,0,0,.25);letter-spacing:.04em;}
  .libwrap{justify-self:center;position:relative;}
  .libsel{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#2b2519,#1b1610);border:1px solid var(--hair-strong);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:0 1px 0 rgba(255,247,233,.05) inset,0 4px 10px -6px #000;}
  .libsel .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);}
  .libsel .val{font-family:var(--fd);font-weight:600;font-size:14px;}
  .libsel .knob{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4a4233,#211c14);border:1px solid var(--hair-strong);display:grid;place-items:center;color:var(--ink-dim);font-size:11px;box-shadow:inset 0 1px 1px rgba(255,247,233,.12);}
  .libmenu{position:absolute;top:46px;left:50%;transform:translateX(-50%);min-width:220px;background:linear-gradient(180deg,#241e16,#191309);border:1px solid var(--hair-strong);border-radius:12px;padding:6px;box-shadow:0 18px 40px -14px #000;z-index:40;display:none;}
  .libmenu.open{display:block;}
  .libmenu .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;}
  .libmenu .item:hover{background:rgba(255,247,233,.04);}
  .libmenu .item .st{font-family:var(--fm);font-size:10px;color:var(--ink-mute);}
  .libmenu .item.sel{box-shadow:inset 0 0 0 1px rgba(58,212,196,.3);background:rgba(58,212,196,.07);}
  .libmenu .item.sel .st{color:var(--teal);}
  .topright{justify-self:end;display:flex;align-items:center;gap:14px;}
  .status{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;color:var(--ink-dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:pulse 2.4s ease-in-out infinite;}
  .dot.off{background:#4a4334;box-shadow:none;animation:none;}
  @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
  .btn-reindex{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;background:linear-gradient(180deg,#2c2519,#1d1810);border:1px solid var(--hair-strong);border-radius:8px;padding:8px 14px;box-shadow:0 1px 0 rgba(255,247,233,.06) inset,0 3px 8px -5px #000;transition:.15s;}
  .btn-reindex:hover{border-color:rgba(58,212,196,.4);box-shadow:var(--glow);}
  .btn-reindex .ic{color:var(--teal);font-size:13px;display:inline-block;}
  .btn-reindex.spin .ic{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .body{display:grid;grid-template-columns:var(--treew,288px) 1fr 332px;min-height:0;transition:grid-template-columns .25s;}
  .body.nodock{grid-template-columns:var(--treew,288px) 1fr 0px;}
  .body.notrans{transition:none;}

  .tree{background:linear-gradient(180deg,#1a1610,#15110c);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;position:relative;}
  .tree::after{content:"";position:absolute;top:0;right:0;width:3px;height:100%;background:linear-gradient(180deg,var(--wood-a),var(--wood-b));opacity:.55;}
  .tree-head{padding:14px 18px 10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-mute);display:flex;justify-content:space-between;}
  .tree-head .count{font-family:var(--fm);color:var(--ink-dim);}
  .tree-scroll{overflow:auto;padding:2px 8px 16px;flex:1;}
  .tree-scroll::-webkit-scrollbar{width:9px;}.tree-scroll::-webkit-scrollbar-thumb{background:#2c2619;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-dim);font-size:13.5px;transition:.12s;}
  .row:hover{background:rgba(255,247,233,.035);color:var(--ink);}
  .row .tw{width:10px;font-size:9px;color:var(--ink-mute);transition:.15s;flex:0 0 auto;display:inline-block;}
  .row.open .tw{transform:rotate(90deg);}
  .row .ic{width:16px;flex:0 0 auto;color:var(--ink-mute);font-size:14px;text-align:center;}
  .row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .badge{font-family:var(--fm);font-size:9px;color:var(--ink-mute);border:1px solid var(--hair-strong);border-radius:4px;padding:2px 5px;background:rgba(0,0,0,.25);}
  .row.child{padding-left:26px;}
  .row.selected{background:linear-gradient(90deg,rgba(58,212,196,.16),rgba(58,212,196,.04));color:#fff;box-shadow:inset 0 0 0 1px rgba(58,212,196,.3),inset 3px 0 0 var(--teal);}
  .row.selected .badge{border-color:rgba(58,212,196,.45);background:rgba(58,212,196,.08);}
  .row.selected .ic{color:var(--teal);}
  .tree-empty{padding:18px;color:var(--ink-mute);font-size:12.5px;line-height:1.7;}
  .tree-search{padding:0 12px 10px;position:relative;}
  .tree-search input{width:100%;background:#15110b;border:1px solid var(--hair-strong);border-radius:8px;padding:8px 12px 8px 32px;color:var(--ink);font-family:var(--fb);font-size:12.5px;outline:none;transition:.15s;}
  .tree-search input::placeholder{color:var(--ink-mute);}
  .tree-search input:focus{border-color:rgba(58,212,196,.45);box-shadow:var(--glow);}
  .tree-search .ts-ic{position:absolute;left:24px;top:11px;width:11px;height:11px;border:1.6px solid var(--ink-mute);border-radius:50%;pointer-events:none;transition:.15s;}
  .tree-search .ts-ic::after{content:"";position:absolute;right:-4px;bottom:-3px;width:5px;height:1.6px;background:var(--ink-mute);border-radius:2px;transform:rotate(45deg);transform-origin:left center;transition:.15s;}
  .tree-search input:focus + .ts-ic{border-color:var(--teal);}
  .tree-search input:focus + .ts-ic::after{background:var(--teal);}
  .tree-scroll mark,.row mark{background:rgba(58,212,196,.22);color:var(--teal);border-radius:3px;padding:0 1px;}
  .tree-resize{position:absolute;top:0;right:-3px;width:9px;height:100%;cursor:col-resize;z-index:7;}
  .tree-resize::after{content:"";position:absolute;top:0;right:3px;width:2px;height:100%;background:transparent;transition:background .15s,box-shadow .15s;}
  .tree-resize:hover::after,.tree-resize.active::after{background:rgba(58,212,196,.55);box-shadow:0 0 10px rgba(58,212,196,.5);}
  body.col-resizing{cursor:col-resize;user-select:none;}

  .stage{overflow:auto;min-height:0;padding:28px 34px 40px;}
  .stage::-webkit-scrollbar{width:10px;}.stage::-webkit-scrollbar-thumb{background:#2c2619;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
  .album{display:flex;gap:26px;align-items:flex-end;margin-bottom:30px;}
  .cover{width:188px;height:188px;border-radius:10px;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 18px 40px -16px #000,inset 0 0 0 1px var(--hair-strong),inset 0 0 0 6px rgba(0,0,0,.18);}
  .cover .grain{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px);mix-blend-mode:overlay;}
  .cover .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.04em;color:#f0eada;text-shadow:0 2px 10px #000;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);}
  .cover .ring{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25);}
  .meta{flex:1;min-width:0;padding-bottom:6px;}
  .crumbs{font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:12px;}
  .title{font-family:var(--fd);font-weight:600;font-size:34px;letter-spacing:.01em;color:#f4efe4;text-shadow:0 1px 0 #000;line-height:1.05;margin-bottom:14px;}
  .subline{display:flex;align-items:center;gap:14px;color:var(--ink-dim);font-size:13px;flex-wrap:wrap;}
  .pill{font-family:var(--fm);font-size:11px;padding:4px 9px;border-radius:5px;border:1px solid rgba(110,221,129,.4);color:var(--green);background:rgba(110,221,129,.08);}
  .pill.lossy{border-color:rgba(58,212,196,.4);color:var(--teal);background:rgba(58,212,196,.08);}
  .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-mute);}
  .tbl-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .ttl-tracks{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);}
  .toggle{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-mute);cursor:pointer;font-family:var(--fm);letter-spacing:.04em;}
  .toggle .sw{width:30px;height:16px;border-radius:999px;background:#241f18;position:relative;border:1px solid var(--hair-strong);transition:.18s;}
  .toggle .sw::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:var(--ink-mute);transition:.18s;}
  .toggle.on .sw{background:rgba(58,212,196,.25);border-color:rgba(58,212,196,.4);}
  .toggle.on .sw::after{left:auto;right:1px;background:var(--teal);box-shadow:0 0 8px var(--teal);}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-family:var(--fm);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--hair-strong);}
  th.num,td.num{text-align:right;}
  th.tech,td.tech{color:#6f6757;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--hair);font-size:13px;}
  tbody tr{transition:.1s;}
  tbody tr:hover{background:linear-gradient(90deg,rgba(58,212,196,.07),transparent 80%);box-shadow:inset 3px 0 0 var(--teal);}
  td.idx{font-family:var(--fm);color:var(--ink-mute);width:34px;}
  td.fname{color:var(--ink);}
  td.mono{font-family:var(--fm);color:var(--ink-dim);font-size:12px;}
  td.tech{font-family:var(--fm);font-size:12px;}
  td.fmt{font-family:var(--fm);font-size:11px;}
  .hide-tech .tech{display:none;}

  .placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink-mute);gap:18px;}
  .placeholder .glyph{width:74px;height:74px;border-radius:50%;border:1px solid var(--hair-strong);display:grid;place-items:center;font-size:30px;color:var(--ink-dim);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);}
  .standby{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;}
  .standby .gauge{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 50% 38%,#221c14,#120e08);border:1px solid var(--hair-strong);box-shadow:inset 0 2px 8px -2px #000,0 0 0 6px rgba(0,0,0,.25);}
  .standby .gauge .led{width:14px;height:14px;border-radius:50%;background:#3a3327;box-shadow:inset 0 1px 2px #000;}
  .standby.scanning .gauge .led{background:var(--teal);box-shadow:0 0 16px var(--teal);animation:pulse 1s ease-in-out infinite;}
  .standby .gauge .ring{position:absolute;inset:14px;border-radius:50%;border:2px solid var(--hair-strong);border-top-color:var(--teal);opacity:0;}
  .standby.scanning .gauge .ring{opacity:1;animation:spin .9s linear infinite;}
  .standby h2{font-family:var(--fd);font-weight:600;font-size:22px;color:var(--ink);}
  .standby p{color:var(--ink-mute);font-size:13.5px;max-width:360px;line-height:1.6;}
  .standby .scanbar{width:280px;height:8px;border-radius:99px;background:#15110b;border:1px solid var(--hair-strong);overflow:hidden;display:none;}
  .standby.scanning .scanbar{display:block;}
  .standby .scanbar i{display:block;height:100%;width:0;background:var(--grad);box-shadow:0 0 12px rgba(58,212,196,.5);}
  .btn-cta{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;background:linear-gradient(180deg,#243029,#141a17);border:1px solid rgba(58,212,196,.45);border-radius:10px;padding:13px 22px;box-shadow:var(--glow);transition:.15s;}
  .btn-cta:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(58,212,196,.6),0 0 28px -3px rgba(58,212,196,.6);}
  .btn-cta .ic{color:var(--teal);}

  .dock{background:linear-gradient(180deg,#1d1811,#150f08);border-left:1px solid var(--hair);position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .dock::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,var(--wood-a),var(--wood-b));opacity:.55;}
  .dock-head{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--hair);}
  .dock-head .t{font-family:var(--fd);font-weight:600;letter-spacing:.18em;font-size:12px;text-transform:uppercase;}
  .dock-head .x{color:var(--ink-mute);font-size:16px;}
  .dock-body{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:22px;}
  .dock-target{font-family:var(--fm);font-size:11px;color:var(--ink-mute);border:1px dashed var(--hair-strong);border-radius:8px;padding:9px 11px;}
  .dock-target b{color:var(--ink-dim);}
  .flabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px;}
  .codec{display:grid;grid-template-columns:1fr 1fr;background:#15110b;border:1px solid var(--hair-strong);border-radius:10px;padding:4px;position:relative;box-shadow:inset 0 2px 5px -2px #000;}
  .codec .opt{position:relative;z-index:1;text-align:center;padding:10px 0;border-radius:7px;}
  .codec .opt .cn{font-family:var(--fd);font-weight:600;font-size:14px;color:var(--ink-dim);transition:.2s;}
  .codec .opt .cs{font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin-top:3px;transition:.2s;}
  .codec .opt.on .cn{color:#10241f;}.codec .opt.on .cs{color:#0c1f1b;}
  .codec .slider{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:7px;background:var(--grad);box-shadow:0 0 16px -3px rgba(58,212,196,.6);transition:transform .25s cubic-bezier(.4,1.3,.5,1);}
  .codec[data-codec="opus"] .slider{transform:translateX(100%);}
  .preset{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#262017,#191409);border:1px solid var(--hair-strong);border-radius:9px;padding:11px 14px;box-shadow:inset 0 1px 0 rgba(255,247,233,.05);width:100%;}
  .preset .pv{font-weight:600;font-size:13.5px;}
  .preset .pk{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4a4233,#211c14);border:1px solid var(--hair-strong);color:var(--ink-dim);display:grid;place-items:center;font-size:10px;transition:.2s;}
  .preset:active .pk{transform:rotate(40deg);}
  .modes{display:flex;flex-direction:column;gap:9px;}
  .mode{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:9px;border:1px solid var(--hair-strong);background:linear-gradient(180deg,#211b13,#17120b);transition:.14s;text-align:left;width:100%;}
  .mode .led{width:13px;height:13px;border-radius:50%;border:1px solid var(--hair-strong);background:#0e0b07;flex:0 0 auto;box-shadow:inset 0 1px 2px #000;}
  .mode .mt b{display:block;font-size:13px;font-weight:600;}
  .mode .mt small{display:block;font-family:var(--fm);font-size:10.5px;color:var(--ink-mute);margin-top:2px;}
  .mode.on{border-color:rgba(58,212,196,.45);box-shadow:var(--glow);background:linear-gradient(180deg,#1d2420,#141a18);}
  .mode.on .led{background:var(--teal);box-shadow:0 0 10px var(--teal),inset 0 0 0 1px rgba(255,255,255,.4);}
  .mode.warn .mt b{color:var(--danger);}
  .mode.warn.on{border-color:rgba(210,114,95,.5);box-shadow:0 0 0 1px rgba(210,114,95,.35),0 0 16px -3px rgba(210,114,95,.5);}
  .mode.warn.on .led{background:var(--danger);box-shadow:0 0 10px var(--danger);}
  .dock-foot{padding:18px 20px 20px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:16px;}
  .start{width:60px;height:60px;border-radius:50%;flex:0 0 auto;position:relative;background:radial-gradient(circle at 50% 35%,#2a3a37,#141a18);border:1px solid rgba(58,212,196,.5);display:grid;place-items:center;box-shadow:var(--glow),inset 0 2px 6px -2px rgba(255,255,255,.15);transition:.15s;}
  .start:hover{box-shadow:0 0 0 1px rgba(58,212,196,.6),0 0 30px -2px rgba(58,212,196,.7);transform:translateY(-1px);}
  .start:active{transform:translateY(1px) scale(.97);}
  .start .pwr{width:24px;height:24px;border-radius:50%;border:2px solid var(--teal);position:relative;box-shadow:0 0 10px rgba(58,212,196,.5);}
  .start .pwr::after{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:2px;height:11px;background:var(--teal);box-shadow:0 0 6px var(--teal);}
  .start-lbl b{font-family:var(--fd);font-weight:600;letter-spacing:.16em;font-size:14px;display:block;}
  .start-lbl small{font-family:var(--fm);font-size:10.5px;color:var(--ink-mute);margin-top:3px;display:block;}

  .queue{background:linear-gradient(180deg,#1b1610,#120e09);border-top:1px solid var(--hair-strong);box-shadow:0 -6px 18px -12px #000;}
  .q-head{display:flex;align-items:center;justify-content:space-between;padding:9px 20px;border-bottom:1px solid var(--hair);}
  .q-head .qt{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:600;letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:var(--ink-dim);}
  .q-head .qt .bub{font-family:var(--fm);font-size:10px;color:var(--teal);border:1px solid rgba(58,212,196,.4);border-radius:999px;padding:1px 8px;background:rgba(58,212,196,.08);}
  .q-head .collapse{color:var(--ink-mute);font-size:11px;display:flex;align-items:center;gap:6px;font-family:var(--fm);}
  .q-head .collapse .ca{transition:.2s;display:inline-block;}
  .queue.collapsed .q-head .collapse .ca{transform:rotate(180deg);}
  .q-list{display:flex;flex-direction:column;max-height:230px;overflow:auto;transition:max-height .25s;}
  .queue.collapsed .q-list{max-height:0;overflow:hidden;}

  .q-row{display:grid;grid-template-columns:14px 230px 1fr 64px 88px 22px;align-items:center;gap:16px;padding:12px 20px;cursor:pointer;transition:.1s;}

  .sdot{width:9px;height:9px;border-radius:50%;}
  .sdot.encoding{background:var(--teal);box-shadow:0 0 10px var(--teal);animation:pulse 1.6s ease-in-out infinite;}
  .sdot.done{background:var(--green);box-shadow:0 0 8px var(--green);}
  .sdot.error{background:var(--danger);box-shadow:0 0 8px var(--danger);}
  .sdot.queued{background:#4a4334;}

  .q-name small{font-family:var(--fm);font-size:10.5px;color:var(--ink-mute);}
  .vu{height:18px;border-radius:5px;background:#120d08;border:1px solid var(--hair-strong);position:relative;overflow:hidden;box-shadow:inset 0 2px 4px -1px #000;}
  .vu .fill{position:absolute;inset:0 auto 0 0;height:100%;width:0;background:var(--grad);box-shadow:0 0 14px rgba(58,212,196,.5);transition:width .25s linear;}
  .vu .fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 2px,transparent 2px 7px);}
  .vu .needle{position:absolute;top:-2px;bottom:-2px;width:2px;background:#eafffb;box-shadow:0 0 8px #fff;left:0;transition:left .25s linear;}

  .vu.done .fill{box-shadow:none;}

  .q-state{font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;text-align:right;}
  .q-state.encoding{color:var(--teal);}.q-state.done{color:var(--green);}.q-state.queued{color:var(--ink-mute);}.q-state.error{color:var(--danger);}

  /* codec color coding */
  .cc-flac{color:#6EDD81;}
  .cc-mp3{color:#E6A95C;}
  .cc-opus{color:#3AD4C4;}
  .cc-aac{color:#1EC2EC;}

  .codec-tag{display:inline-block;font-family:var(--fm);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid color-mix(in srgb,currentColor 42%,transparent);background:color-mix(in srgb,currentColor 13%,transparent);line-height:1.3;}
  .codec-tag.big{font-size:12px;padding:4px 11px;border-radius:6px;}
  .badge[class*="cc-"]{border-color:color-mix(in srgb,currentColor 38%,transparent);background:color-mix(in srgb,currentColor 11%,transparent);}

  .preset-wrap{position:relative;}
  .preset-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:linear-gradient(180deg,#241e16,#191309);border:1px solid var(--hair-strong);border-radius:10px;padding:6px;box-shadow:0 18px 40px -14px #000;z-index:30;display:none;}
  .preset-menu.open{display:block;}
  .pitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink-dim);}
  .pitem:hover{background:rgba(255,247,233,.04);color:var(--ink);}
  .pitem.sel{box-shadow:inset 0 0 0 1px rgba(58,212,196,.3);background:rgba(58,212,196,.07);color:var(--ink);}
  .pitem .pck{color:var(--teal);font-size:11px;opacity:0;}
  .pitem.sel .pck{opacity:1;}
  .preset .pk{transition:.2s;}
  .preset.open .pk{transform:rotate(180deg);color:var(--teal);}

  /* queue logs */
  .q-item{border-bottom:1px solid var(--hair);}
  .q-item:last-child{border-bottom:none;}
  .q-chev{justify-self:center;color:var(--ink-mute);font-size:10px;transition:.2s;}
  .q-item.open .q-chev{transform:rotate(180deg);color:var(--teal);}
  .q-logs{max-height:0;overflow:hidden;transition:max-height .28s ease;background:#0c0906;}
  .q-item.open .q-logs{max-height:232px;border-top:1px solid var(--hair-strong);}
  .q-logs .inner{padding:13px 20px 15px 44px;overflow:auto;max-height:232px;font-family:var(--fm);font-size:11.5px;line-height:1.65;}
  .q-logs .inner::-webkit-scrollbar{width:8px;}.q-logs .inner::-webkit-scrollbar-thumb{background:#2c2619;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
  .ll{white-space:pre-wrap;color:var(--ink-dim);}
  .ll .pf{color:var(--ink-mute);margin-right:9px;user-select:none;}
  .ll.t-cmd{color:var(--teal);}
  .ll.t-map,.ll.t-ok{color:var(--green);}
  .ll.t-done{color:var(--green);font-weight:600;}
  .ll.t-err{color:var(--danger);}
  .ll.t-sys,.ll.t-wait{color:var(--ink-mute);}
  .ll.t-enc,.ll.t-inf{color:var(--ink-dim);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(180deg,#243029,#141a17);border:1px solid rgba(58,212,196,.4);border-radius:10px;padding:11px 18px;font-size:13px;box-shadow:0 12px 30px -10px #000,var(--glow);opacity:0;pointer-events:none;transition:.3s;z-index:60;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (prefers-reduced-motion:reduce){.dot,.sdot.encoding,.vu .needle,.standby .gauge .ring,.btn-reindex.spin .ic{animation:none;}}
</style>

    [16,42,70,100].forEach(function(stop){

    });

      "<div class='subline'>"+codecChip(a.fmt,true)+"<span class='sep'></span><span>"+a.tracks.length+" tracks</span><span class='sep'></span><span>"+a.dur+"</span><span class='sep'></span><span>"+a.size+"</span></div></div></div>"+
      "<div class='tbl-tools'><span class='ttl-tracks'>Tracks</span></div>"+
      "<table><thead><tr><th class='num'>#</th><th>Filename</th><th>Codec</th><th class='tech'>Bitrate</th><th>Duration</th><th class='tech'>Sample</th><th class='tech'>Ch</th><th class='num'>Size</th></tr></thead><tbody>"+rows+"</tbody></table>";
  }
  function standbyHTML(scanning){
    return "<div class='standby"+(scanning?" scanning":"")+"' id='standby'><div class='gauge'><div class='ring'></div><div class='led'></div></div>"+
      "<h2>"+(scanning?"Scanning library…":"Library in standby")+"</h2>"+
      "<p>"+(scanning?"Indexing audio metadata via ffprobe. Directories will appear as they are discovered.":"This library has not been indexed yet. Run a scan to read directories and audio metadata.")+"</p>"+
      "<div class='scanbar'><i id='scanfill'></i></div>"+
      (scanning?"":"<button class='btn-cta' id='cta'><span class='ic'>&#8635;</span> Re-index to scan</button>")+"</div>";
  }
  function bindReindexCta(){var c=$("#cta");if(c)c.onclick=startScan;}

  function renderDock(){
    var dock=$("#dock"),grid=$("#bodygrid"),lib=curLib();
    var show=lib.indexed&&!S.scanning&&S.selected&&ALBUMS[S.selected];
    grid.classList.toggle("nodock",!show);
    if(!show){dock.innerHTML="";return;}
    var a=ALBUMS[S.selected];
    var modes=[["shared","Shared&nbsp;/out","mirror path under shared output",false],["local","Local&nbsp;.alto-out/","subdirectory inside source",false],["replace","Replace&nbsp;&#9888;","overwrite originals · rollback on fail",true]];
    var mh="";modes.forEach(function(m){mh+="<button class='mode"+(m[3]?" warn":"")+(S.mode===m[0]?" on":"")+"' data-mode='"+m[0]+"'><span class='led'></span><span class='mt'><b>"+m[1]+"</b><small>"+m[2]+"</small></span></button>";});
    dock.innerHTML=
      "<div class='dock-head'><span class='t'>Transcode</span></div>"+
      "<div class='dock-body'>"+
        "<div class='dock-target'>directory &middot; <b>"+a.title+"</b></div>"+
        "<div><div class='flabel'>Codec</div><div class='codec' data-codec='"+S.codec+"' id='codec'><div class='slider'></div>"+
          "<div class='opt"+(S.codec==="flac"?" on":"")+"' data-c='flac'><div class='cn'>FLAC</div><div class='cs'>Lossless</div></div>"+
          "<div class='opt"+(S.codec==="opus"?" on":"")+"' data-c='opus'><div class='cn'>Opus</div><div class='cs'>Lossy</div></div></div></div>"+
        "<div><div class='flabel'>Preset</div><div class='preset-wrap'><button class='preset"+(S.presetOpen?" open":"")+"' id='preset'><span class='pv'>"+PRESETS[S.preset]+"</span><span class='pk'>&#9662;</span></button><div class='preset-menu"+(S.presetOpen?" open":"")+"' id='presetmenu'>"+presetItems()+"</div></div></div>"+
        "<div><div class='flabel'>Output mode</div><div class='modes'>"+mh+"</div></div>"+
      "</div>"+
      "<div class='dock-foot'><button class='start' id='start'><span class='pwr'></span></button><div class='start-lbl'><b>START</b><small>"+a.tracks.length+" tracks · ~1m40s</small></div></div>";
    $("#codec").querySelectorAll(".opt").forEach(function(o){o.onclick=function(){S.codec=o.getAttribute("data-c");renderDock();};});
    $("#preset").onclick=function(e){e.stopPropagation();S.presetOpen=!S.presetOpen;renderDock();};
    $("#presetmenu").querySelectorAll(".pitem").forEach(function(it){it.onclick=function(e){e.stopPropagation();S.preset=+it.getAttribute("data-i");S.presetOpen=false;renderDock();};});
    dock.querySelectorAll(".mode").forEach(function(m){m.onclick=function(){S.mode=m.getAttribute("data-mode");renderDock();};});
    $("#start").onclick=function(){enqueue(a);};
  }

  function renderQueue(){
    var list=$("#qlist"),q=$("#queue");list.innerHTML="";
    q.classList.toggle("collapsed",S.collapsed);
    var active=S.queue.filter(function(j){return j.status==="encoding";}).length;
    var queued=S.queue.filter(function(j){return j.status==="queued";}).length;
    $("#qbub").textContent=S.queue.length?(active+" active · "+queued+" queued"):"idle";
    if(!S.queue.length){list.appendChild(el("div","q-empty","No jobs. Select a directory and press START."));return;}
    S.queue.forEach(function(j){
      var item=el("div","q-item"+(j.logsOpen?" open":""));
      var row=el("div","q-row");
      var pctTxt=j.status==="queued"?"&mdash;":Math.round(j.pct)+"%";
      row.innerHTML="<span class='sdot "+j.status+"'></span>"+
        "<div class='q-name'><b>"+j.title+"</b><small>"+colorSub(j.sub)+"</small></div>"+
        "<div class='vu "+j.status+"'><div class='fill' style='width:"+j.pct+"%'></div><div class='needle' style='left:"+j.pct+"%'></div></div>"+
        "<div class='q-pct "+j.status+"'>"+pctTxt+"</div>"+
        "<div class='q-state "+j.status+"'>"+j.status+"</div>"+
        "<span class='q-chev' title='transcode logs'>&#9662;</span>";
      row.onclick=function(){j.logsOpen=!j.logsOpen;renderQueue();};
      var logs=el("div","q-logs");
      var inner=el("div","inner");
      inner.innerHTML=jobLogs(j).map(function(l){return "<div class='ll t-"+l[0]+"'><span class='pf'>"+logPrefix(l[0])+"</span>"+esc(l[1])+"</div>";}).join("");
      logs.appendChild(inner);
      item.appendChild(row);item.appendChild(logs);
      list.appendChild(item);
      if(j.logsOpen&&j.status==="encoding"){inner.scrollTop=inner.scrollHeight;}
    });
  }
  function enqueue(a){
    var anyActive=S.queue.some(function(j){return j.status==="encoding";});
    S.queue.push({id:S.qid++,title:a.title,sub:a.fmt+" → "+(S.codec==="flac"?"FLAC":"Opus "+PRESETS[S.preset].replace(/[^0-9k]/g,"")),pct:0,status:anyActive?"queued":"encoding"});
    if(S.collapsed){S.collapsed=false;}
    renderQueue();toast("Queued “"+a.title+"”");
  }
  function tick(){
    var changed=false;
    S.queue.forEach(function(j){
      if(j.status==="encoding"){
        j.pct+=1.4+Math.random()*2.2;
        if(j.pct>=100){j.pct=100;j.status="done";}
        changed=true;
      }
    });
    if(changed){
      if(!S.queue.some(function(j){return j.status==="encoding";})){
        var next=S.queue.filter(function(j){return j.status==="queued";})[0];
        if(next)next.status="encoding";
      }
      renderQueue();renderTop();
    }
  }

  function startScan(){
    var lib=curLib();S.scanning=true;renderTop();renderStage();renderTree();renderDock();
    $("#reindex").classList.add("spin");
    var f=$("#scanfill");var p=0;
    var iv=setInterval(function(){
      p+=6+Math.random()*9;if(f)f.style.width=Math.min(p,100)+"%";
      if(p>=100){clearInterval(iv);
        S.scanning=false;lib.indexed=true;lib.count=lib.count||2140;
        $("#reindex").classList.remove("spin");
        S.selected=S.selected||"mastodon-remission";S.selectedId=S.selectedId||"m-remission";
        renderAll();toast("Scan complete · directories indexed");
      }
    },260);
  }

  var toastTimer;
  function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show");},2200);}
  function renderAll(){renderTop();renderTree();renderStage();renderDock();renderQueue();}

  $("#libsel").onclick=function(e){e.stopPropagation();$("#libmenu").classList.toggle("open");};
  document.addEventListener("click",function(){$("#libmenu").classList.remove("open");if(S.presetOpen){S.presetOpen=false;renderDock();}});
  $("#reindex").onclick=function(){if(!S.scanning)startScan();};
  $("#qcollapse").onclick=function(){S.collapsed=!S.collapsed;renderQueue();};
  $("#treesearch").oninput=function(){S.query=this.value;renderTree();};
  (function(){
    var h=$("#treeresize"),grid=$("#bodygrid"),drag=false,sx=0,sw=0;
    h.addEventListener("mousedown",function(e){drag=true;sx=e.clientX;sw=S.treeW;h.classList.add("active");grid.classList.add("notrans");document.body.classList.add("col-resizing");e.preventDefault();});
    window.addEventListener("mousemove",function(e){if(!drag)return;S.treeW=Math.max(288,Math.min(560,sw+(e.clientX-sx)));applyTreeW();});
    window.addEventListener("mouseup",function(){if(!drag)return;drag=false;h.classList.remove("active");grid.classList.remove("notrans");document.body.classList.remove("col-resizing");});
  })();
  applyTreeW();

  renderAll();
  setInterval(tick,300);
})();
</script>
</body>
</html>
